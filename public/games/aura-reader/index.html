<body><div id="app" class="app"></div><dialog id="modal" aria-labelledby="modal-title"></dialog><div id="announcer" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<script>
'use strict';
const TYPES=['slash','fist','wave'];
const META={slash:{name:'斬気',symbol:'斬',color:'var(--slash)',leader:'斬のリーダー'},fist:{name:'拳気',symbol:'拳',color:'var(--fist)',leader:'拳のリーダー'},wave:{name:'波気',symbol:'波',color:'var(--wave)',leader:'波のリーダー'},neutral:{name:'無属性',symbol:'無',color:'var(--neutral)'}};
const BEATS={slash:'wave',wave:'fist',fist:'slash'};
const EFFECT_HANDLERS={activate:drawAbilityEffect,open:drawAbilityEffect};
function drawAbilityEffect({player:p,card}){const before=p.hand.length;draw(p,1);say(p.name+'：「'+card.name+'」の効果で'+(p.hand.length-before)+'枚ドロー。');}
function createDeck(){let cards=[];for(const t of [...TYPES,'neutral']){const n=t==='neutral'?9:6;for(let i=0;i<n;i++)for(let copy=0;copy<2;copy++)cards.push({id:`${t}-${i}-${copy}`,type:t,power:t==='neutral'?1:[1,1,2,2,3,3][i],name:`${META[t].symbol}の${['灯','印','刃','環','響','極','星','月','空'][i]}`,effect:i===0?'activate':i===1?'open':null});}return cards;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function powerFor(p,opponent){let base=1+(p.level&&p.leader===p.aura?1:0);const abilities=p.zones[p.aura].filter(c=>c.type===p.aura||c.type==='neutral').reduce((s,c)=>s+c.power,0);const mod=BEATS[p.aura]===opponent.aura?1:BEATS[opponent.aura]===p.aura?-2:0;return{base,abilities,mod,total:Math.max(0,base+abilities+mod)};}
let g=null,playerCount=3,epoch=0,dialogCallback=null;
const $=s=>document.querySelector(s);
function alive(){return g.players.filter(p=>p.hp>0);}
function player(id){return g.players[id];}
function say(s){g.log.unshift(s);$('#announcer').textContent=s;}
function orderFrom(id){return Array.from({length:g.players.length},(_,i)=>(id+i)%g.players.length).filter(i=>player(i).hp>0);}
function draw(p,n){for(let i=0;i<n;i++){if(!g.deck.length&&g.discard.length){g.deck=shuffle(g.discard.splice(0));say('捨て札をシャッフルして山札を補充。');}if(!g.deck.length){say(`${p.name}：山札・捨て札が空のためドローを省略。`);break;}const card=g.deck.pop();card.face=false;card.resolved=false;p.hand.push(card);}}
function closeDialog(){const d=$('#modal');d.close();const cb=dialogCallback;dialogCallback=null;if(cb)cb();}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function newGame(){epoch++;g={players:Array.from({length:playerCount},(_,i)=>({id:i,name:i===0?'あなた':`CPU ${i}`,leader:null,hp:10,level:false,gotAdv:false,hand:[],zones:{slash:[],fist:[],wave:[]},aura:null,history:[]})),deck:shuffle(createDeck()),discard:[],log:[],turn:0,phase:'準備',priority:0,actor:null,order:[],pending:[],revealed:false,message:'先手を決めています',detail:'三すくみで勝者が1人になるまで再抽選します。'};let rolls,winners;do{rolls=g.players.map(()=>TYPES[Math.floor(Math.random()*3)]);winners=g.players.filter(p=>rolls.some(t=>t!==rolls[p.id])&&rolls.every(t=>t===rolls[p.id]||BEATS[rolls[p.id]]===t));}while(winners.length!==1);g.priority=winners[0].id;g.order=orderFrom(g.priority);say(`先手抽選：${g.players.map(p=>`${p.name} ${META[rolls[p.id]].symbol}`).join(' / ')}。${player(g.priority).name}が先手。`);g.pickIndex=0;render();pickLeader();}
function pickLeader(){while(g.pickIndex<g.order.length){let p=player(g.order[g.pickIndex]);const options=TYPES.filter(t=>!g.players.some(q=>q.leader===t));if(p.id===0){openDialog('あなたのリーダーを選択',`<p class="note">先手：${player(g.priority).name}。通常の威力は全属性1。<br>相性有利を取ったターンの終了時、得意属性が2になります。</p><div class="leader-options">${TYPES.map(t=>`<button class="leader-pick" ${options.includes(t)?'':'disabled'} onclick="chooseLeader('${t}')"><span class="symbol" style="color:${META[t].color}">${META[t].symbol}</span>${META[t].leader}<small>${options.includes(t)?`強化時：${META[t].name} ＋1`:'CPUが選択済み'}</small></button>`).join('')}</div>`,null,false);return;}p.leader=options[Math.floor(Math.random()*options.length)];say(`${p.name}は${META[p.leader].leader}を選択。`);g.pickIndex++;}for(const p of g.players)draw(p,3);startTurn();}
function chooseLeader(t){player(0).leader=t;say(`あなたは${META[t].leader}を選択。`);g.pickIndex++;closeDialog();pickLeader();}
function logHtml(){return g.log.slice(0,90).map((s,i)=>`<p class="${i===0?'latest':''}">${s}</p>`).join('');}
function startTurn(){if(!g||g.phase==='終了')return;g.turn++;g.phase='セット';g.order=orderFrom(g.priority);g.setIndex=0;g.priorityStep=false;g.revealed=false;g.selection=null;for(const p of alive()){p.gotAdv=false;p.aura=null;}say(`── ターン${g.turn}：${player(g.priority).name}が先手・優先権。`);advanceSet();}
async function advanceSet(){const ticket=epoch;if(g.setIndex>=g.order.length){g.actor=null;priorityChoice();return;}const p=player(g.order[g.setIndex]);g.actor=p.id;draw(p,p.id===g.priority?2:1);say(`${p.name}が${p.id===g.priority?2:1}枚ドロー。`);g.message=p.id===0?'カードを置き、オーラを選択':'CPUがカードをセットしています';g.detail=p.id===0?'手札から好きなゾーンに配置。オーラを伏せるまでは、伏せカードを自由に置き換えられます。':'伏せカードの位置と枚数から、相手の狙いを予想しましょう。';render();if(p.id!==0){await delay(650);if(ticket!==epoch)return;cpuSet(p);g.setIndex++;render();await delay(450);if(ticket===epoch)advanceSet();}}
function cpuScores(p){return TYPES.map(t=>{let score=Math.random()*2+(p.level&&p.leader===t?.7:0);score+=p.hand.filter(c=>c.type===t||c.type==='neutral').reduce((s,c)=>s+c.power,0)*.65;for(const q of alive().filter(q=>q!==p)){const recent=q.history.slice(-4);if(recent.length){const predicted=recent[Math.floor(Math.random()*recent.length)];score+=BEATS[t]===predicted?1.2:BEATS[predicted]===t?-.6:0;}for(const z of TYPES){const count=q.zones[z].length;score+=BEATS[t]===z?count*.65:BEATS[z]===t?-count*.35:0;}}return{type:t,score};}).sort((a,b)=>b.score-a.score);}
function cpuSet(p){p.aura=cpuScores(p)[0].type;let activation;while((activation=p.hand.find(c=>c.effect==='activate'))){p.hand.splice(p.hand.indexOf(activation),1);activation.face=true;p.zones[p.aura].push(activation);EFFECT_HANDLERS.activate({game:g,player:p,card:activation});say(p.name+'が「'+activation.name+'」を発動し、'+META[p.aura].symbol+'ゾーンへ配置。');}const opens=p.hand.filter(c=>c.effect==='open');const powers=p.hand.filter(c=>c.effect!=='open'&&(c.type===p.aura||c.type==='neutral')).sort((a,b)=>b.power-a.power).slice(0,3);for(const c of [...opens,...powers]){p.hand.splice(p.hand.indexOf(c),1);c.face=false;p.zones[p.aura].push(c);}if(p.hand.length&&Math.random()<.65){const c=p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0];c.face=false;const other=TYPES.filter(t=>t!==p.aura);p.zones[other[Math.floor(Math.random()*2)]].push(c);}say(p.name+'がオーラをセット。');}
function canEdit(){return g.phase==='セット'&&g.actor===0&&!g.priorityStep;}
function confirmActivate(id,t){const c=player(0).hand.find(c=>c.id===id);openDialog('発動を使いますか？',`${cardDetail(c)}<p>「${c.name}」を表向きで${META[t].name}ゾーンへ置きます。</p><div class="dialog-actions"><button onclick="inspectHand('${id}')">戻る / 使わない</button><button class="primary" onclick="placeCard('${id}','${t}',true)">発動する</button></div>`);}
async function placeCard(id,t,face){if(!canEdit())return;const p=player(0),i=p.hand.findIndex(c=>c.id===id);if(i<0)return;const c=p.hand.splice(i,1)[0];c.face=face;p.zones[t].push(c);closeDialog();if(face){EFFECT_HANDLERS.activate({game:g,player:p,card:c});say(`あなたが「${c.name}」を発動し、${META[t].symbol}ゾーンへ配置。`);render();await flash('発動',`${c.name} / ${META[t].name}ゾーン`);}render();}
function inspectZone(t,id){const c=player(0).zones[t].find(c=>c.id===id);if(!c)return;openDialog(`${c.name} ${c.face?'· 表向き':'· 裏向き'}`,cardDetail(c)+(canEdit()&&!c.face?`<h3>置き換える</h3><div class="row">${TYPES.filter(z=>z!==t).map(z=>`<button onclick="moveCard('${t}','${id}','${z}')">${META[z].name}へ</button>`).join('')}<button onclick="moveCard('${t}','${id}','hand')">手札に戻す</button></div>`:c.face?'<p class="note">公開済みのカードです。エンドフェイズに捨て札になります。</p>':'<p class="note">セット終了後は置き換えられません。</p>'));}
function moveCard(from,id,to){if(!canEdit())return;const p=player(0),i=p.zones[from].findIndex(c=>c.id===id);if(i<0||p.zones[from][i].face)return;const c=p.zones[from].splice(i,1)[0];if(to==='hand')p.hand.push(c);else p.zones[to].push(c);closeDialog();render();}
function finishHumanSet(){if(!canEdit()||!g.selection)return;player(0).aura=g.selection;say('あなたがオーラをセット。');g.actor=null;g.setIndex++;advanceSet();}
async function priorityChoice(){g.priorityStep=true;g.message='全員がオーラをセットしました';g.detail='優先権プレイヤーは、手札1枚を捨ててオーラを変更できます。';render();const p=player(g.priority);if(p.id===0&&p.hand.length){openDialog('優先権：オーラを変更しますか？',`<p>現在は<span style="color:${META[p.aura].color}">${META[p.aura].name}</span>。相手のオーラはまだ非公開です。</p><p class="note">手札1枚を捨てることで、1回だけ変更できます。</p>${publicZoneSummary()}<div class="dialog-actions"><button onclick="closeDialog();beginOpen()">変更しない</button><button class="primary" onclick="choosePriorityDiscard()">手札を選んで変更</button></div>`,null,false);return;}const ticket=epoch;await delay(500);if(ticket!==epoch)return;if(p.id!==0&&p.hand.length){const desired=cpuScores(p)[0].type;const oldValue=p.zones[p.aura].reduce((s,c)=>s+((c.type===p.aura||c.type==='neutral')?c.power:0),0);if(desired!==p.aura&&oldValue<2&&Math.random()<.4){const c=p.hand.sort((a,b)=>a.power-b.power).shift();c.face=true;g.discard.push(c);p.aura=desired;say(`${p.name}は「${c.name}」を捨ててオーラを変更。`);}}beginOpen();}
function choosePriorityDiscard(){const p=player(0);openDialog('捨てる手札を1枚選択',`<div class="effect-list">${p.hand.map(c=>`<button onclick="choosePriorityAura('${c.id}')">${c.name} · ${META[c.type].name} ＋${c.power}</button>`).join('')}</div><div class="dialog-actions"><button onclick="closeDialog();beginOpen()">変更しない</button></div>`,null,false);}
function choosePriorityAura(id){const p=player(0),c=p.hand.find(c=>c.id===id);openDialog('変更先のオーラを選択',`<p>「${c.name}」を捨てて変更します。</p><div class="row">${TYPES.filter(t=>t!==p.aura).map(t=>`<button class="primary" onclick="commitPriority('${id}','${t}')">${META[t].name}に変更</button>`).join('')}</div><div class="dialog-actions"><button onclick="choosePriorityDiscard()">戻る</button></div>`,null,false);}
function commitPriority(id,t){const p=player(0),i=p.hand.findIndex(c=>c.id===id);if(i<0)return;const c=p.hand.splice(i,1)[0];c.face=true;g.discard.push(c);p.aura=t;say(`あなたは「${c.name}」を捨ててオーラを変更。`);closeDialog();beginOpen();}
async function beginOpen(){if(g.phase!=='セット')return;g.phase='オープン';g.actor=null;g.message='オーラ、オープン！';g.detail='全員のオーラと、対応するゾーンのカードを公開します。';render();const ticket=epoch;await flash('オーラ、オープン！');if(ticket!==epoch)return;g.revealed=true;for(const p of alive()){p.history.push(p.aura);for(const c of p.zones[p.aura])c.face=true;}say(g.order.map(id=>`${player(id).name}：${META[player(id).aura].name}`).join(' / '));g.openIndex=0;render();await delay(650);if(ticket===epoch)processOpen();}
async function processOpen(){if(g.effectBusy||g.phase!=='オープン')return;const ticket=epoch;while(g.openIndex<g.order.length){const p=player(g.order[g.openIndex]);g.actor=p.id;const cards=p.zones[p.aura].filter(c=>c.effect==='open'&&!c.resolved);if(!cards.length){g.openIndex++;continue;}g.message=p.name+'のオープン能力';g.detail='公開したオープン効果は必ず発動します。複数枚ある場合は順番を選べます。';render();if(p.id===0&&cards.length>1){openDialog('オープン能力の発動順',`<p class="note">すべて強制発動します。次に発動するカードを選んでください。</p><div class="effect-list">${cards.map(c=>`<div class="effect-item"><div><b style="color:${META[c.type].color}">${c.name}</b><br><small>＋${c.power} / 1枚ドロー</small></div><button class="primary" onclick="resolveOpen('${c.id}')">次に発動</button></div>`).join('')}</div>`,null,false);return;}await performOpen(p,cards[0]);if(ticket!==epoch)return;}g.actor=null;startBattles();}
async function resolveOpen(id){if(!g||g.phase!=='オープン'||g.actor!==0||g.effectBusy)return;const p=player(0),c=p.zones[p.aura].find(c=>c.id===id&&c.effect==='open'&&!c.resolved);if(!c)return;closeDialog();const ticket=epoch;await performOpen(p,c);if(ticket===epoch)processOpen();}
async function performOpen(p,c){const ticket=epoch;g.effectBusy=true;c.resolved=true;EFFECT_HANDLERS.open({game:g,player:p,card:c});say(p.name+'：「'+c.name+'」のオープンが強制発動。');render();await flash('オープン能力',p.name+' / '+c.name);if(ticket===epoch)g.effectBusy=false;}
function autoAdvance(action,ms){const ticket=epoch,state=g,phase=g.phase,turn=g.turn,battle=g.battleIndex;setTimeout(()=>{if(ticket===epoch&&g===state&&g.phase===phase&&g.turn===turn&&g.battleIndex===battle)action();},ms);}
function startBattles(){g.phase='ダメージ';const o=g.order;g.battles=o.length===3?[[o[0],o[1]],[o[1],o[2]],[o[2],o[0]]]:[[o[0],o[1]]];g.battleIndex=0;g.battleReady=true;nextBattle();}
function eliminate(){for(const p of g.players){if(p.hp<=0&&!p.eliminated){p.hp=0;p.eliminated=true;g.discard.push(...p.hand.splice(0));for(const t of TYPES)g.discard.push(...p.zones[t].splice(0));say(`${p.name}が脱落。手札と場のカードを捨て札へ。`);}}}
function checkGameOver(){const survivors=alive();if(survivors.length>1)return false;g.phase='終了';g.actor=null;g.message=survivors.length?`${survivors[0].name=== 'あなた'?'あなたの勝利！':survivors[0].name+'の勝利'}`:'引き分け';g.detail=`${g.turn}ターンで決着。${survivors.length?'最後までHPが残ったリーダーが勝者です。':'生存プレイヤーがいなくなりました。'}`;say(g.message);render();return true;}
function nextBattle(){if(g.phase!=='ダメージ'||!g.battleReady)return;g.battleReady=false;while(g.battleIndex<g.battles.length){const [aId,bId]=g.battles[g.battleIndex++];const a=player(aId),b=player(bId);if(a.hp<=0||b.hp<=0){say(`${a.name} 対 ${b.name}：脱落者を含むため省略。`);continue;}const aPower=powerFor(a,b),bPower=powerFor(b,a);for(const [p,pow] of [[a,aPower],[b,bPower]])if(pow.mod===1){p.gotAdv=true;draw(p,1);say(`${p.name}は相性有利で1枚ドロー。`);}const dmg=Math.abs(aPower.total-bPower.total);const loser=aPower.total<bPower.total?a:aPower.total>bPower.total?b:null;if(loser)loser.hp=Math.max(0,loser.hp-dmg);g.message=`${a.name} 対 ${b.name}`;g.detail=`<span class="battle-numbers"><span style="color:${META[a.aura].color}"><small>${META[a.aura].name}</small><strong>${aPower.total}</strong><small>${aPower.base}＋${aPower.abilities}${aPower.mod>=0?'＋':'−'}${Math.abs(aPower.mod)}</small></span><span class="muted">VS</span><span style="color:${META[b.aura].color}"><small>${META[b.aura].name}</small><strong>${bPower.total}</strong><small>${bPower.base}＋${bPower.abilities}${bPower.mod>=0?'＋':'−'}${Math.abs(bPower.mod)}</small></span></span>${loser?`${loser.name}に${dmg}ダメージ`:'同じ威力のためダメージなし'}`;say(`${a.name} ${aPower.total} 対 ${b.name} ${bPower.total} → ${loser?`${loser.name}に${dmg}ダメージ`:'ダメージなし'}。`);eliminate();g.battleReady=true;if(checkGameOver())return;render();autoAdvance(nextBattle,1800);return;}endTurn();}
function endTurn(){g.phase='エンド';for(const p of alive()){for(const t of TYPES){for(const c of p.zones[t]){if(c.face)g.discard.push(c);else p.hand.push(c);c.resolved=false;}p.zones[t]=[];}const old=p.level;p.level=p.gotAdv;if(old!==p.level)say(`${p.name}：${p.level?'レヴェリングへ変身！ 次のターンから'+META[p.leader].name+'の威力＋1。':'相性有利がなかったため通常状態に戻る。'}`);p.aura=null;}g.revealed=false;const next=orderFrom(g.priority).filter(id=>id!==g.priority);g.priority=next[0]??g.priority;g.message=`ターン${g.turn} 終了`;g.detail=`表向きカードを捨て、裏向きカードを手札へ回収しました。次の先手は${player(g.priority).name}です。`;say(`優先権は${player(g.priority).name}へ移動。`);render();autoAdvance(startTurn,1100);}
function askReset(){openDialog('対戦を終了しますか？','<p>進行中の対戦は保存されません。</p><div class="dialog-actions"><button onclick="closeDialog()">対戦を続ける</button><button onclick="resetGame()">タイトルへ戻る</button></div>');}
function resetGame(){epoch++;closeDialog();g=null;render();}
let handPage=0,modalPage=0,modalPageSize=4,lastView=null,lastEpoch=-1;
const reduced=()=>typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function handSize(){return innerWidth<700?4:7;}
function cardFace(c,back=false,kind='ability',label=''){const m=META[c.type]||META.neutral;return `<span class="physical-card ${kind} ${back?'back':''}" style="--cardcolor:${m.color}">${back?`<span class="kind">${kind==='aura'?'AURA':'ABILITY'}</span><span class="symbol">${kind==='aura'?'気':'◇'}</span>${label?`<span class="face-note">${label}</span>`:''}`:`<span class="kind">${kind==='leader'?'LEADER':kind==='aura'?'AURA':'ABILITY'}</span><span class="card-top"><span>${m.name}</span>${kind==='ability'?`<b class="power">+${c.power}</b>`:''}</span><span class="symbol">${m.symbol}</span><span class="card-name">${c.name||m.name}</span>${kind==='ability'?`<span class="effect">${c.effect==='activate'?'発動':c.effect==='open'?'オープン':'威力強化'}</span>`:''}`}</span>`;}
function leaderHtml(p){const t=p.leader||'neutral',m=META[t];return `<button class="physical-card leader ${p.level?'level':''}" data-motion="leader-${p.id}" style="--cardcolor:${m.color}" onclick="inspectLeader(${p.id})" aria-label="${p.name}の${m.leader||'リーダー'}を確認"><span class="kind">LEADER</span><span class="symbol">${m.symbol}</span><span class="card-name">${p.level?'レヴェリング':'通常'}</span><span class="stats">${TYPES.map(t=>`${META[t].symbol}${1+(p.level&&p.leader===t?1:0)}`).join(' ')}</span></button>`;}
function auraHtml(p){return `<button class="zone-stack" data-motion="aura-${p.id}" onclick="inspectAura(${p.id})" aria-label="${p.name}のオーラカードを確認">${p.aura?cardFace({type:p.aura},!g.revealed,'aura',p.id===0?META[p.aura].name:''): '<span class="empty-slot">＋</span>'}</button>`;}
function playerView(p){const own=p.id===0;const hand=`<span class="cpu-hand" data-motion="hand-${p.id}"><span>${Array.from({length:Math.min(3,p.hand.length)},()=>'<i class="tiny-back"></i>').join('')}</span><span class="hand-count">手札 ${p.hand.length}</span></span>`;return `<section class="player ${own?'own-player':''} ${g.actor===p.id?'acting':''} ${p.hp<=0?'dead':''}" aria-label="${p.name}の場"><div class="player-head"><span class="player-name">${p.name}${p.hp<=0?'<span class="badge">脱落</span>':g.priority===p.id?'<span class="badge">優先権</span>':''}</span>${!own?hand:''}<span class="hp"><span class="hp-meter"><i style="width:${p.hp*10}%"></i></span>${p.hp}<small>/10 HP</small></span></div><div class="field"><div class="slot leader-slot"><span class="slot-title">リーダー</span>${leaderHtml(p)}</div>${!own?hand:''}${TYPES.map(t=>{const cards=p.zones[t],c=cards[cards.length-1];return `<div class="slot ability-slot ${g.revealed&&p.aura===t?'chosen':''}" style="border-color:color-mix(in srgb,${META[t].color} 60%,transparent)"><span class="slot-title" style="color:${META[t].color}">${META[t].symbol}ゾーン</span><button class="zone-stack ${cards.length>1?'stacked':''}" data-motion="zone-${p.id}-${t}" aria-label="${p.name}の${META[t].name}ゾーン ${cards.length}枚" onclick="inspectStack(${p.id},'${t}')">${c?cardFace(c,!c.face):'<span class="empty-slot">＋</span>'}${cards.length?`<span class="stack-count">${cards.length}</span>`:''}</button></div>`;}).join('')}<div class="slot aura-slot"><span class="slot-title">オーラ</span>${auraHtml(p)}</div></div></section>`;}
function render(){clearCardDrag();const positions=capturePositions();if(epoch!==lastEpoch){lastView=null;handPage=0;lastEpoch=epoch;}const before=lastView;$('#app').innerHTML=`<header class="topbar"><div class="brand">オーラリーダー<small>CARD BATTLE</small></div><nav class="toolbar" aria-label="ゲームメニュー"><button onclick="showRules()">遊び方</button>${g?'<button onclick="showLog()">履歴</button><button onclick="askReset()">終了</button>':''}</nav></header>${g?gameView():startView()}`;layoutHand();lastView=viewSnapshot();animateChanges(before,lastView,positions);}
function startView(){return `<main class="start"><section class="start-panel"><div class="start-intro"><div class="eyebrow">AURA READER · DIGITAL TRIAL</div><h1>オーラを伏せて、読み合おう。</h1><p>アビリティを仕込み、斬・拳・波で勝負。<br>最後まで生き残ったリーダーが勝利。</p></div><div class="intro-cards">${TYPES.map(t=>cardFace({type:t},false,'aura')).join('')}</div><div class="start-setup"><h2>対戦人数</h2><div class="choice">${[2,3].map(n=>`<button class="${playerCount===n?'active':''}" aria-pressed="${playerCount===n}" onclick="playerCount=${n};render()">${n}人戦<small>あなた＋CPU ${n-1}人</small></button>`).join('')}</div></div><div class="start-action"><button class="primary" onclick="newGame()">対戦をはじめる →</button><span class="note">斬（緑）＞ 波（青）＞ 拳（赤）＞ 斬</span></div><p class="note">リーダー3種類・アビリティ54枚。発動・オープンは、それぞれ山札から1枚ドロー。</p></section></main>`;}
function gameView(){const hand=player(0).hand;const pileTop=g.discard.at(-1);return `<main class="board"><div class="statusbar"><div class="turn">TURN<strong>${String(g.turn).padStart(2,'0')}</strong></div><div class="phases">${['セット','オープン','ダメージ','エンド'].map((p,i)=>`<span class="${g.phase===p?'current':''}">${i+1} ${p}</span>`).join('')}</div></div><div class="opponents ${g.players.length===2?'solo':''}">${g.players.slice(1).map(playerView).join('')}</div><div class="center-row"><button class="pile" data-motion="deck" onclick="inspectDeck()" aria-label="山札 ${g.deck.length}枚">${cardFace({type:'neutral'},true)}<span class="pile-label">山札<b>${g.deck.length}</b></span></button><section class="info-panel" aria-label="進行状況"><span class="eyebrow">${g.phase==='終了'?'BATTLE COMPLETE':g.actor===0&&g.phase==='セット'?'YOUR TURN':g.phase==='エンド'?'TURN END':g.phase==='ダメージ'?'AURA BATTLE':'AURA READER'}</span><div class="headline">${g.message}</div><div class="detail">${compactDetail()}</div></section><button class="pile" data-motion="discard" onclick="inspectDiscard()" aria-label="捨て札 ${g.discard.length}枚">${pileTop?cardFace(pileTop):'<span class="physical-card" style="background:#173034;border:1px dashed #8bafa5;box-shadow:none;color:#9cbaaf;justify-content:center">空</span>'}<span class="pile-label">捨て札<b>${g.discard.length}</b></span></button></div>${playerView(player(0))}<section class="hand-section" data-motion="hand-0"><div class="hand-head"><h2>あなたの手札 <b>${hand.length}枚</b> <small class="instruction">ドラッグで場に置く / タップで詳細</small></h2></div><div class="hand">${hand.map(cardHtml).join('')||'<span class="empty">手札はありません</span>'}</div></section><div class="action-bar">${centerActions()}</div></main>`;}
function compactDetail(){if(g.phase==='ダメージ')return g.detail;if(g.phase==='セット'){if(g.priorityStep)return '相手の配置を見て、オーラを変更できます。';return g.actor===0?'手札を置く → オーラを選ぶ → セット完了':'CPUの伏せた場所と枚数に注目。';}if(g.phase==='エンド')return `次の先手は${player(g.priority).name}。変身は次ターンから有効。`;return g.detail;}
function cardHtml(c){return `<button class="physical-card" style="--cardcolor:${META[c.type].color}" data-card-id="${c.id}" onclick="inspectHand('${c.id}')" aria-label="${c.name} ${META[c.type].name} 威力${c.power} ${c.effect==='activate'?'発動':c.effect==='open'?'オープン':'威力強化'}"><span class="card-top">${META[c.type].symbol}<b class="power">+${c.power}</b></span><span class="symbol">${META[c.type].symbol}</span><span class="card-name">${c.name}</span><span class="effect">${c.effect==='activate'?'発動':c.effect==='open'?'オープン':'威力強化'}</span></button>`;}
function centerActions(){if(g.phase==='終了')return '<button class="primary" onclick="newGame()">もう一度対戦</button><button onclick="resetGame()">タイトルへ</button>';if(canEdit())return `<div class="aura-choices" aria-label="オーラカードを選択">${TYPES.map(t=>`<button class="aura-select ${g.selection===t?'selected':''}" style="--cardcolor:${META[t].color}" aria-pressed="${g.selection===t}" aria-label="${META[t].name}を選ぶ" data-motion="choice-${t}" onclick="g.selection='${t}';render()"><span class="symbol">${META[t].symbol}</span><small>オーラ</small></button>`).join('')}</div><button class="primary" ${g.selection?'':'disabled'} onclick="finishHumanSet()">伏せてセット完了</button>`;if(g.phase==='エンド')return '<span class="action-hint">次のターンへ自動で進みます…</span>';if(g.phase==='ダメージ')return '<span class="action-hint">バトル結果を表示中 · 自動で進みます…</span>';if(g.phase==='セット'&&g.priorityStep&&g.priority===0&&player(0).hand.length)return '<button class="primary" onclick="priorityChoice()">優先権の選択に戻る</button>';if(g.phase==='オープン'&&g.actor===0&&!g.effectBusy)return '<button class="primary" onclick="processOpen()">オープンの発動順を選ぶ</button>';return '<span class="action-hint">カードをタップすると確認できます</span>';}
function pagerHtml(page,count,fn){return `<div class="pager"><button aria-label="前のページ" ${page<=0?'disabled':''} onclick="${fn}(${page-1})">‹</button><span>${page+1} / ${Math.max(1,count)}</span><button aria-label="次のページ" ${page>=count-1?'disabled':''} onclick="${fn}(${page+1})">›</button></div>`;}
function changeHandPage(n){handPage=n;render();}
function openDialog(title,body,callback=null,closable=true){if(title==='オープン能力の発動順'||title.startsWith('優先権：'))closable=true;const d=$('#modal');if(d.open)d.close();dialogCallback=callback;d.innerHTML=`<div class="dialog-top"><h2 id="modal-title">${title}</h2>${closable?'<button aria-label="閉じる" data-close>×</button>':''}</div><div class="dialog-content">${body}</div>`;d.oncancel=e=>{if(!closable)e.preventDefault();};let backdropDown=false;const outside=e=>{const r=d.getBoundingClientRect();return e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom);};d.onpointerdown=e=>{backdropDown=outside(e);};d.onpointercancel=()=>{backdropDown=false;};d.onclick=e=>{const dismiss=closable&&backdropDown&&outside(e);backdropDown=false;if(dismiss)closeDialog();};d.querySelector('[data-close]')?.addEventListener('click',closeDialog);d.showModal();modalPage=0;const list=d.querySelector('.effect-list');if(list&&list.children.length>3){list.dataset.paginated='true';list.insertAdjacentHTML('afterend','<div id="modal-pager"></div>');paginateModal(0);}}
function paginateModal(n){modalPage=n;const list=$('#modal .effect-list');if(!list)return;const items=[...list.children];items.forEach((e,i)=>e.hidden=i<n*3||i>=(n+1)*3);$('#modal-pager').innerHTML=pagerHtml(n,Math.ceil(items.length/3),'paginateModal');}
function cardDetail(c){return `<div class="dialog-card-layout">${cardFace(c)}<div><p><b>${META[c.type].name} · 威力＋${c.power}</b></p><p class="note">${c.type==='neutral'?'どのオーラにも威力を加算。':'同じ属性のオーラに威力を加算。'}${c.effect?`<br>${c.effect==='activate'?'発動：手札から表向きに置いて使用。':'オープン：このゾーンを公開した時に強制発動。'}<br>効果：山札からカードを1枚引く。`:''}</p></div></div>`;}
function inspectHand(id){const c=player(0).hand.find(c=>c.id===id);if(!c)return;openDialog(c.name,cardDetail(c)+(canEdit()?`<h3>裏向きで置く</h3><div class="placement">${TYPES.map(t=>`<button style="--cardcolor:${META[t].color}" onclick="placeCard('${id}','${t}',false)">${META[t].name}<small>伏せてセット</small></button>`).join('')}</div>${c.effect==='activate'?`<h3>発動を使って表向きで置く</h3><div class="placement">${TYPES.map(t=>`<button style="--cardcolor:${META[t].color}" onclick="confirmActivate('${id}','${t}')">${META[t].name}<small>発動する</small></button>`).join('')}</div>`:''}`:''));}
function inspectStack(id,t){const p=player(id),cards=p.zones[t];if(!cards.length){openDialog(`${p.name}の${META[t].name}ゾーン`,'<p>カードは置かれていません。手札のカードを選ぶと配置できます。</p>');return;}if(id===0&&cards.length===1){inspectZone(t,cards[0].id);return;}openDialog(`${p.name}の${META[t].name}ゾーン · ${cards.length}枚`,`<div class="effect-list">${cards.map(c=>`<button onclick="${id===0?`inspectZone('${t}','${c.id}')`:c.face?`inspectPublic('${c.id}')`:''}" ${id!==0&&!c.face?'disabled':''}>${id===0||c.face?`${c.name} · ${META[c.type].name} ＋${c.power}${c.face?' · 表向き':' · 裏向き'}`:'◇ 伏せカード'}</button>`).join('')}</div>`);}
function inspectPublic(id){const c=[...g.discard,...g.players.flatMap(p=>TYPES.flatMap(t=>p.zones[t]))].find(c=>c.id===id);if(c)openDialog(c.name,cardDetail(c));}
function inspectLeader(id){const p=player(id);if(!p.leader)return;openDialog(`${p.name}のリーダーカード`,`<div class="dialog-card-layout">${leaderHtml(p)}<div><p><b>${META[p.leader].leader} · ${p.level?'レヴェリング':'通常'}</b></p><p>${TYPES.map(t=>`${META[t].name}：${1+(p.level&&p.leader===t?1:0)}`).join(' / ')}</p></div></div><p class="note">相性有利を取ったターンの終了時に裏返り、次ターンから${META[p.leader].name}が＋1。有利を取れなかったターンは通常に戻ります。</p>`);}
function inspectAura(id){const p=player(id);openDialog(`${p.name}のオーラカード`,p.aura?(g.revealed||id===0?`<div class="dialog-card-layout">${cardFace({type:p.aura},false,'aura')}<p>${g.revealed?'公開中です。':'あなたにだけ見えています。相手には裏向きです。'}</p></div>`:'<p>まだ裏向きです。オープンフェイズで公開します。</p>'):'<p>まだオーラをセットしていません。</p>');}
function inspectDeck(){openDialog('山札',`<p>残り <b>${g.deck.length}枚</b>。引く順番と内容は非公開です。</p><p class="note">山札がなくなったら捨て札をシャッフル。両方空なら、ドローせず進めます。</p>`);}
function inspectDiscard(){openDialog(`捨て札 · ${g.discard.length}枚`,`<div class="effect-list">${[...g.discard].reverse().map(c=>`<button onclick="inspectPublic('${c.id}')">${c.name} · ${META[c.type].name} ＋${c.power}</button>`).join('')||'<p>捨て札はありません。</p>'}</div>`);}
function publicZoneSummary(){return alive().filter(p=>p.id!==0).map(p=>`<h3>${p.name}の配置</h3><div class="public-summary">${TYPES.map(t=>`<span style="color:${META[t].color}">${META[t].name} ${p.zones[t].length}枚${p.zones[t].some(c=>c.face)?'<br>公開 '+p.zones[t].filter(c=>c.face).map(c=>META[c.type].symbol+'+'+c.power).join(' / '):''}</span>`).join('')}</div>`).join('');}
function showLog(page=0){const entries=g.log.slice(page*5,(page+1)*5);openDialog('バトルログ',`<div class="log">${entries.map(s=>`<p>${s}</p>`).join('')}</div>${pagerHtml(page,Math.ceil(g.log.length/5),'showLog')}`);}
const rulePages=[['カードの置き方','手札をドラッグして自分のアビリティゾーンで離すと配置できます。タップして配置先を選ぶこともできます。カードの属性と違うゾーンにも伏せられます。','伏せカードは自分だけ確認でき、自分のセットが終わるまで回収・移動が自由です。','最後に画面下のオーラを選び「伏せてセット完了」。手札は全枚表示され、枚数が多いと重なります。重なったカードもタップやドラッグで操作できます。'],['三すくみとダメージ','斬（緑）＞ 波（青）＞ 拳（赤）＞ 斬（緑）。有利は威力＋1と1枚ドロー。不利は威力−2。威力は0未満になりません。','リーダー威力＋選んだゾーンの同属性・無属性アビリティ＋相性補正を比較。低い側が差分のダメージを受けます。','HPは10。最後まで残れば勝利。同じ威力ならダメージはありません。'],['発動・オープン','発動は手札から使い、指定したゾーンへ表向きで配置します。選んだオーラのゾーンで、属性が合えば威力も加算します。','オープンは対応ゾーンを公開した時に必ず発動します。先手から順に、各プレイヤーが自分のカードを好きな順で1枚ずつ選びます。','発動は任意、オープンは強制です。どちらも効果は「山札からカードを1枚引く。」です。引いたカードは通常どおり手札に加わります。'],['優先権と変身','優先権があればセット開始のドローが2枚になります。全員のセット後、手札1枚を捨ててオーラを1回変更できます。','相手のオーラは非公開です。伏せた場所・枚数を見て予想しましょう。','相性有利を取ったターンの最後にリーダーを裏返し、次ターンから得意属性＋1。有利がないターンは通常に戻ります。'],['ターン終了・3人戦','ターン終了時、表向きカードは捨て札へ、裏向きカードは手札へ戻ります。優先権は次の生存者へ移ります。','3人戦は先手対二番手、二番手対三番手、三番手対先手の順に戦います。相性補正はバトルごとに計算します。','脱落者を含む残りのバトルは省略。バトル結果とターン終了後は自動で進行します。あなたの脱落後も決着まで自動で観戦できます。']];
function showRules(page=0){const [title,...paras]=rulePages[page];openDialog('遊び方',`<h3>${title}</h3><div class="rules">${paras.map(s=>`<p>${s}</p>`).join('')}</div>${pagerHtml(page,rulePages.length,'showRules')}`);}
function flash(title,sub=''){return new Promise(resolve=>{const el=document.createElement('div');el.className='effect-toast';el.innerHTML=`<strong>${title}</strong>${sub?`<small>${sub}</small>`:''}`;document.body.append(el);setTimeout(()=>{el.remove();resolve();},reduced()?100:850);});}
function capturePositions(){const map={};if(typeof document.querySelectorAll!=='function')return map;document.querySelectorAll('[data-motion]').forEach(el=>{const rect=el.getBoundingClientRect();if(rect.width&&rect.height)map[el.dataset.motion]=rect;});document.querySelectorAll('[data-card-id]').forEach(el=>map[el.dataset.cardId]=el.getBoundingClientRect());return map;}
function viewSnapshot(){if(!g)return null;const cards={};for(const c of g.deck)cards[c.id]={c,loc:'deck',front:false};for(const c of g.discard)cards[c.id]={c,loc:'discard',front:true};for(const p of g.players){for(const c of p.hand)cards[c.id]={c,loc:`hand-${p.id}`,front:p.id===0};for(const t of TYPES)for(const c of p.zones[t])cards[c.id]={c,loc:`zone-${p.id}-${t}`,front:!!c.face};}return{cards,players:g.players.map(p=>({id:p.id,aura:p.aura,level:p.level,leader:p.leader})),revealed:g.revealed};}
function animateChanges(before,after,positions){if(!before||!after||reduced())return;const targets=capturePositions();let flights=0;for(const [id,item] of Object.entries(after.cards)){const old=before.cards[id];if(!old)continue;if(old.loc!==item.loc&&flights<9){const source=positions[id]||positions[old.loc],dest=targets[id]||targets[item.loc];if(source&&dest){flyCard(item.c,source,dest,!item.front||(!old.front&&item.loc!=='discard'));flights++;}}else if(!old.front&&item.front&&item.loc.startsWith('zone-')){document.querySelector(`[data-motion="${item.loc}"] .physical-card`)?.classList.add('flip');}}
for(const p of after.players){const old=before.players.find(q=>q.id===p.id);if(!old)continue;const el=document.querySelector(`[data-motion="aura-${p.id}"] .physical-card`);if((!before.revealed&&after.revealed)||old.aura!==p.aura)el?.classList.add('flip');if(old.level!==p.level)document.querySelector(`[data-motion="leader-${p.id}"]`)?.classList.add('flip');if(!old.aura&&p.aura){const source=positions[`choice-${p.aura}`]||positions[`hand-${p.id}`],dest=targets[`aura-${p.id}`];if(source&&dest)flyCard({type:p.aura},source,dest,true,'aura');}}
}
function flyCard(c,source,dest,back,kind='ability'){const holder=document.createElement('div');holder.innerHTML=cardFace(c,back,kind);const el=holder.firstElementChild;if(!el?.animate)return;el.classList.add('flying-card');const width=Math.min(62,source.width),height=width*1.4;Object.assign(el.style,{left:(source.x+source.width/2-width/2)+'px',top:(source.y+source.height/2-height/2)+'px',width:width+'px',height:height+'px'});document.body.append(el);const dx=dest.x+dest.width/2-source.x-source.width/2,dy=dest.y+dest.height/2-source.y-source.height/2;const animation=el.animate([{transform:'translate(0,0) rotate(-7deg)',opacity:1},{transform:`translate(${dx*.6}px,${dy*.6-20}px) rotate(5deg)`,opacity:1,offset:.55},{transform:`translate(${dx}px,${dy}px) rotate(0) scale(.8)`,opacity:.2}],{duration:550,easing:'ease-in-out'});animation.onfinish=()=>el.remove();}
window.addEventListener('resize',()=>{if(g)render();});

// Pointer events cover mouse, pen and touch without changing the tap controls.
let cardDrag=null,ignoreDragClickUntil=0;
function dragDestination(x,y){const el=document.elementFromPoint(x,y)?.closest('.own-player .ability-slot');const zone=el?.querySelector('[data-motion]')?.dataset.motion?.replace('zone-0-','');return TYPES.includes(zone)?{el,zone}:null;}
function clearCardDrag(){const d=cardDrag;cardDrag=null;if(!d)return;d.ghost?.remove();d.source.classList.remove('drag-source');document.querySelectorAll('.drop-ready,.drop-hover').forEach(el=>el.classList.remove('drop-ready','drop-hover'));try{if(d.source.hasPointerCapture(d.pointer))d.source.releasePointerCapture(d.pointer);}catch{}if(d.started)ignoreDragClickUntil=Date.now()+400;}
function dropHandCard(id,zone){if(!g||!canEdit()||!TYPES.includes(zone))return;const c=player(0).hand.find(c=>c.id===id);if(!c)return;if(c.effect==='activate'){openDialog(`${META[zone].name}ゾーンへ置く`,cardDetail(c)+`<p>裏向きでセットするか、発動して表向きで置くか選んでください。</p><div class="dialog-actions"><button onclick="closeDialog()">キャンセル</button><button onclick="placeCard('${id}','${zone}',false)">伏せて置く</button><button class="primary" onclick="placeCard('${id}','${zone}',true)">発動して置く</button></div>`);}else placeCard(id,zone,false);}
document.addEventListener('pointerdown',e=>{if(cardDrag||e.button!==0||!e.isPrimary||!g||!canEdit()||$('#modal').open)return;const source=e.target.closest('.hand [data-card-id]');if(!source)return;cardDrag={source,id:source.dataset.cardId,pointer:e.pointerId,x:e.clientX,y:e.clientY,started:false,epoch};try{source.setPointerCapture(e.pointerId);}catch{}});
document.addEventListener('pointermove',e=>{const d=cardDrag;if(!d||e.pointerId!==d.pointer)return;if(d.epoch!==epoch||!g||!canEdit()||!d.source.isConnected){clearCardDrag();return;}if(!d.started){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<8)return;d.started=true;const rect=d.source.getBoundingClientRect();d.ghost=d.source.cloneNode(true);d.ghost.removeAttribute('onclick');d.ghost.removeAttribute('data-card-id');d.ghost.setAttribute('aria-hidden','true');d.ghost.classList.add('drag-ghost');Object.assign(d.ghost.style,{width:rect.width+'px',height:rect.height+'px'});document.body.append(d.ghost);d.source.classList.add('drag-source');document.querySelectorAll('.own-player .ability-slot').forEach(el=>el.classList.add('drop-ready'));$('#announcer').textContent='置きたいアビリティゾーンで離してください。';}e.preventDefault();d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));dragDestination(e.clientX,e.clientY)?.el.classList.add('drop-hover');},{passive:false});
document.addEventListener('pointerup',e=>{const d=cardDrag;if(!d||e.pointerId!==d.pointer)return;const target=d.started&&d.epoch===epoch?dragDestination(e.clientX,e.clientY):null;clearCardDrag();if(d.started){e.preventDefault();if(target)dropHandCard(d.id,target.zone);else $('#announcer').textContent='配置をキャンセルしました。カードは手札に残ります。';}});
document.addEventListener('pointercancel',e=>{if(cardDrag?.pointer===e.pointerId)clearCardDrag();});
document.addEventListener('lostpointercapture',e=>{if(cardDrag?.pointer===e.pointerId)clearCardDrag();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cardDrag){clearCardDrag();e.preventDefault();}});
document.addEventListener('click',e=>{if(e.detail!==0&&Date.now()<ignoreDragClickUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('dragstart',e=>{if(e.target.closest('.hand [data-card-id]'))e.preventDefault();});
window.addEventListener('blur',clearCardDrag);

function handGeometry(count,width,height){const h=Math.max(1,Math.min(175,height-14)),w=Math.min(h*5/7,Math.max(1,width-6));const step=count>1?Math.min(w+14,Math.max(0,(width-6-w)/(count-1))):0;const start=(width-(w+step*Math.max(0,count-1)))/2;return{width:w,height:h,step,start};}
function layoutHand(){const tray=document.querySelector('.hand');if(!tray?.getBoundingClientRect)return;const cards=[...tray.querySelectorAll('[data-card-id]')],rect=tray.getBoundingClientRect(),v=handGeometry(cards.length,rect.width,rect.height);cards.forEach((card,i)=>Object.assign(card.style,{left:(v.start+i*v.step)+'px',top:'10px',width:v.width+'px',height:v.height+'px',zIndex:String(i+1)}));}
render();
</script></body></html>
